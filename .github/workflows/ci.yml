name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      # Testler kendi geçici veritabanlarını gerçek migration'larla kurar;
      # şema ↔ migration uyumsuzluğu (drift) ve kapsam eşiği burada yakalanır.
      - name: Unit & integration tests (coverage threshold)
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high --prod

  e2e:
    name: E2E (Chromium + WebKit)
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build and run E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop shell (macOS)
    runs-on: macos-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri derlemesi gömülü Node ve sunucu kaynaklarının hazır olmasını ister
      - name: Build server and prepare desktop resources
        run: pnpm build && node scripts/prepare-desktop.mjs
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
