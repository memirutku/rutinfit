<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RutinFit</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { text-align: center; max-width: 420px; padding: 32px; }
      .spinner { width: 36px; height: 36px; margin: 0 auto 20px; border: 4px solid #334155; border-top-color: #10b981;
        border-radius: 50%; animation: spin 1s linear infinite; }
      .error .spinner { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin: 0; }
      .error p { color: #fda4af; }
    </style>
  </head>
  <body>
    <main class="card" id="card" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h1>RutinFit açılıyor</h1>
      <p id="status">Verileriniz hazırlanıyor…</p>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
