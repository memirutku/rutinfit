[package]
name = "rutinfit"
version = "0.1.0"
description = "RutinFit Desktop"
authors = ["RutinFit Contributors"]
license = "MIT"
repository = "https://github.com/memirutku/rutinfit"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rutinfit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
getrandom = "0.3"
